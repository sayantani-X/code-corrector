[project]
name = "backend"
version = "0.1.0"
description = "Autonomous AI Software Engineer Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.136.3",
    "google-genai>=2.7.0",
    "mypy>=2.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "tenacity>=9.1.4",
    "uvicorn>=0.48.0",
    "langgraph>=0.1.0",
    "bandit>=1.7.5",
]

[tool.pyright]
extraPaths = ["."]
