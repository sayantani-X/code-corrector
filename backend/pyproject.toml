[project]
name = "backend"
version = "0.1.0"
description = "Autonomous AI Software Engineer Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.136.3",
    "google-genai>=2.7.0",
    "mypy>=2.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "tenacity>=9.1.4",
    "uvicorn>=0.48.0",
    "langgraph>=0.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "bandit>=1.7.5",
    "google-cloud-run>=0.16.1",
    "google-cloud-logging>=3.16.1",
    "psycopg[binary,pool]>=3.2.1",
    "redis>=5.0.0",
    "sse-starlette>=3.4.5",
]

[tool.pyright]
extraPaths = ["."]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
